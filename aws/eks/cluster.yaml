apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: cloudscale-cluster
  region: ap-south-1

nodeGroups:
  - name: ng-standard
    instanceType: t3.small
    minSize: 2
    maxSize: 3
    volumeSize: 20
    iam:
      withAddonPolicies:
        autoScaler: true
        cloudWatch: true
        albIngress: true
