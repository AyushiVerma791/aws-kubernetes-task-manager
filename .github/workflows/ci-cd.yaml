name: CloudScale CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  id-token: write # Required for AWS OIDC authentication
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: app/package-lock.json

      - name: Install Dependencies
        working-directory: ./app
        run: npm ci

      - name: Generate Prisma Client
        working-directory: ./app
        run: npx prisma generate

      - name: Run Unit Tests
        working-directory: ./app
        run: npm test

  docker-build-push:
    name: Docker Build & Push to AWS ECR
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and Push Docker Image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: cloudscale-api
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./app
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG -t $ECR_REGISTRY/$ECR_REPOSITORY:latest .
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest

  deploy-to-eks:
    name: Deploy to Amazon EKS
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-south-1

      - name: Update KubeConfig
        run: aws eks update-kubeconfig --name cloudscale-cluster --region ap-south-1

      - name: Deploy to Kubernetes
        env:
          ECR_REGISTRY: 402349693545.dkr.ecr.ap-south-1.amazonaws.com
          ECR_REPOSITORY: cloudscale-api
          IMAGE_TAG: ${{ github.sha }}
        working-directory: ./k8s/base
        run: |
          # Use kustomize to set the new image tag dynamically
          kustomize edit set image $ECR_REGISTRY/$ECR_REPOSITORY:latest=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          
          # Apply manifests (including the pre-install Prisma migration Job)
          kubectl apply -k .

          # Wait for the rolling update to complete successfully
          kubectl rollout status deployment/cloudscale-api --timeout=5m
